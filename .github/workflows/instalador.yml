name: Instalador Windows

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write # para publicar a versão nas Releases
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Cada montagem no branch principal vira uma versão nova (0.3.<número da montagem>).
      - name: Versão
        shell: pwsh
        run: npm version --no-git-tag-version "0.3.${{ github.run_number }}"
      # Reconhecedor offline do "Ei, Zarb" (Vosk, português, ~31 MB). Fica fora do git.
      # atalho: o arquivo não é conferido por hash; o SHA-256 sai no log. Melhorar: fixar o hash aqui.
      - name: Reconhecedor de voz offline
        shell: pwsh
        run: |
          Invoke-WebRequest https://alphacephei.com/vosk/models/vosk-model-small-pt-0.3.zip -OutFile voz.zip
          (Get-FileHash voz.zip -Algorithm SHA256).Hash
          Expand-Archive voz.zip -DestinationPath voz-tmp
          New-Item -ItemType Directory -Force resources/voz | Out-Null
          tar -czf resources/voz/modelo-pt.tar.gz -C voz-tmp vosk-model-small-pt-0.3
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: instalador
          path: dist/*.exe
          retention-days: 14
      # Publica só no branch principal e só com a chave de assinatura configurada.
      - name: Assinar e publicar a versão
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        shell: pwsh
        env:
          ASSINATURA_VERSOES: ${{ secrets.ASSINATURA_VERSOES }}
          GH_TOKEN: ${{ github.token }}
          NOTAS: ${{ github.event.head_commit.message }}
        run: |
          if (-not $env:ASSINATURA_VERSOES) { Write-Host "Sem o segredo ASSINATURA_VERSOES: versão não publicada."; exit 0 }
          $v = (Get-Content package.json | ConvertFrom-Json).version
          $exe = "dist/Assistente-Zarb-$v.exe"
          node scripts/assinar.mjs $exe
          gh release create "v$v" $exe "$exe.sig" "$exe.blockmap" dist/latest.yml --title "Versão $v" --notes "$env:NOTAS" --latest

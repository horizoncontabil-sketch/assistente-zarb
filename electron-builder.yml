appId: br.com.zarbmedia.assistente
productName: Assistente Zarb
directories:
  output: dist
files:
  - out/**
  - package.json
# Fora do pacote: ícone da bandeja e o reconhecedor de voz offline (baixado na montagem).
extraResources:
  - from: resources
    to: .
    filter:
      - '**/*'
win:
  target: nsis
  icon: build/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Assistente Zarb

appId: br.com.zarbmedia.assistente
productName: Assistente Zarb
directories:
  output: dist
files:
  - out/**
  - package.json
# Fora do pacote: ícone da bandeja e o reconhecedor de voz offline (baixado na montagem).
extraResources:
  - from: resources
    to: .
    filter:
      - '**/*'
win:
  target: nsis
  icon: build/icon.png
  artifactName: Assistente-Zarb-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Assistente Zarb
# Atualização automática: versões nas Releases do próprio repositório (público).
publish:
  provider: github
  owner: ZarbMedia9
  repo: assistente-zarb
  releaseType: release
